[package]
name = "liner-music"
version = "0.2.23"
description = "Liner Music for iOS — Tauri v2 + Rust native host"
authors = ["Liner Team"]
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
default-run = "liner-music"

# iOS links against a *static* archive, so `staticlib` is mandatory.
# `cdylib` keeps the desktop/Android path working and `rlib` lets the
# unit tests in this crate use the modules directly.
[lib]
name = "liner_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "liner-music"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Compiles the iOS platform shim (.m) into the crate so all three crate types
# link; see build.rs.
cc = "1"

[dependencies]
# ---- core -------------------------------------------------------------
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
log = "0.4"
once_cell = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
aes-gcm = "0.10"

# ---- async / net ------------------------------------------------------
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
  "fs",
  "io-util",
] }
# rustls + ring keeps TLS inside the binary: no OpenSSL/libcurl dependency on a
# device where we cannot add dylibs.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "stream",
  "json",
  "charset",
] }
futures-util = "0.3"

# ---- audio ------------------------------------------------------------
symphonia = { version = "0.5", default-features = false, features = [
  "mp3",
  "aac",
  "flac",
  "ogg",
  "vorbis",
  "isomp4",
  "wav",
  "pcm",
] }
cpal = "0.15"

# ---- signing (vendored from tryliner/desktop `signer/`) ----------------
liner-signer = { path = "crates/liner-signer" }

[profile.release]
# An .ipa is downloaded to the device: optimise for size, and keep panics
# aborting so nothing unwinds across the ObjC boundary.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

[profile.dev]
incremental = true

[features]
# Tauri's "serve the built assets from the binary" path.
custom-protocol = ["tauri/custom-protocol"]

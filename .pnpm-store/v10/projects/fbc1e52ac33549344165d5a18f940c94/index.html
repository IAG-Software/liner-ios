<!doctype html>
<html lang="en" class="antialiased bg-transparent" suppresshydrationwarning>
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover is what lets env(safe-area-inset-*) report real values
      inside WKWebView; without it the insets are always 0 and the player bar
      slides under the home indicator.
      user-scalable=no / maximum-scale=1 stop the double-tap zoom that would
      otherwise fight the lyrics gesture handler.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="dark light" />
    <title>Liner</title>
    <!-- Runs before the module graph so a failed bundle is visible on screen
         and in Documents/liner-boot.log instead of a silent black page. -->
    <script src="./boot-guard.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Montserrat:wght@100..900&family=Roboto+Flex:GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,wdth,wght@-200..150,27..175,323..603,25..135,649..854,-305..-98,560..788,416..570,528..760,8..144,25..151,100..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --font-inter: "Inter Variable", "Inter", sans-serif;
        /* bundled SF Pro (src/assets/fonts); on iOS -apple-system resolves to
           the system SF Pro, so the bundled file is only a fallback. */
        --font-sf: "SF Pro", -apple-system, BlinkMacSystemFont,
          var(--font-inter);
        --font-geist-mono: "Geist Mono", monospace;
        --font-roboto-flex: "Roboto Flex", sans-serif;
        --font-montserrat-family: "Montserrat", sans-serif;

        /* Real device insets, resolved by WKWebView (iOS 11+). */
        --sai-top: env(safe-area-inset-top, 0px);
        --sai-right: env(safe-area-inset-right, 0px);
        --sai-bottom: env(safe-area-inset-bottom, 0px);
        --sai-left: env(safe-area-inset-left, 0px);
      }

      /* The desktop build painted a rounded window frame here. On iOS the app
         is full-bleed; leaving the root transparent lets the native WKWebView
         background colour show through, which is how a "page never loaded"
         failure is distinguished from "page loaded, JS failed". */
      html.app-window #root:empty {
        background: transparent;
      }

      /* Kill the rubber-band scroll on the document; individual panes opt in. */
      html,
      body {
        height: 100%;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
      }

      body {
        /* Full-bleed on iOS: no desktop window padding. */
        padding: 0;
        margin: 0;
      }

      /* Momentum scrolling + 120 Hz ProMotion: `will-change: transform` on a
         scroll container forces layer promotion, which lets the compositor run
         at the display's refresh rate instead of the main thread's 60 Hz. */
      .liner-scroll {
        -webkit-overflow-scrolling: touch;
        will-change: transform;
        transform: translateZ(0);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (max-width: 639px) {
        /* iOS zooms the whole page when a focused control's font-size is below
           16px — the single most jarring thing about a desktop layout on a
           phone, and it persists after blur. */
        input,
        textarea,
        select {
          font-size: 16px !important;
        }

        /* Remove the 300 ms tap delay and the grey flash on taps. */
        button,
        a,
        [role="button"] {
          touch-action: manipulation;
          -webkit-tap-highlight-color: transparent;
        }

        /* The desktop layout sets fixed min-widths in places; clipping here
           stops a single wide row from shifting the entire viewport sideways. */
        #root {
          overflow-x: hidden;
          overscroll-behavior-y: none;
        }
      }
    </style>
  </head>
  <body class="h-full w-full bg-transparent overflow-hidden">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
